<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6cf4a" />
    <meta name="description" content="黄大厨专属菜谱：安排每日菜单、管理冰箱、生成菜谱图并迁移厨房数据。" />
    <title>黄大厨专属菜谱</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <main id="appContent" class="app-content" tabindex="-1"></main>

      <nav class="tab-bar" aria-label="主要导航">
        <button class="tab-button is-active" data-tab="home" aria-current="page">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15 16 5l12 10v12H19v-8h-6v8H4V15Z"/></svg>
          <span>首页</span>
        </button>
        <button class="tab-button" data-tab="menu">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="8" y="4" width="16" height="24" rx="2"/><path d="M12 11h8m-8 5h8m-8 5h5"/></svg>
          <span>菜单</span>
        </button>
        <button class="tab-button" data-tab="fridge">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="26" rx="3"/><path d="M7 13h18M11 8v2m0 7v4"/></svg>
          <span>冰箱</span>
        </button>
        <button class="tab-button" data-tab="profile">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 28v-9a7 7 0 0 1 14 0v9M7 13c2-6 4-9 9-9s7 3 9 9M12 8l-2-5m5 4V2m4 6 2-5"/></svg>
          <span>我的</span>
        </button>
      </nav>

      <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
      <section class="bottom-sheet" id="bottomSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
        <button class="sheet-close" id="sheetClose" aria-label="关闭">×</button>
        <div id="sheetBody"></div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
